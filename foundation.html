<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Goals</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css">
</head>
<body>
  <div class="grid-container">
    <div class="grid-x grid-padding-x">
      <div class="cell small-12 medium-6 large-4">
        <h1>Future Career</h1>
        <p>Cybersecurity Analyst at JPMorgan or BMW Group.</p>
      </div>
      <div class="cell small-12 medium-6 large-4">
        <div class="callout success">Skills: Compliance, Fraud Detection, Java, Risk Management.</div>
      </div>
      <div class="cell small-12 medium-6 large-4">
        <button class="button alert" data-open="careerModal">More</button>
        <div class="reveal" id="careerModal" data-reveal>
          <h2>Long-term Goal</h2>
          <p>Work in global risk management, leadership role.</p>
          <button class="close-button" data-close>&times;</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/js/foundation.min.js"></script>
  <script>$(document).foundation();</script>
</body>
</html>
