<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kean Study Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Joseph @ Kean</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Schedule</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Skills</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Grid -->
    <div class="container mt-4">
      <div class="row text-center">
        <div class="col bg-info p-3">Tuesday – Classes 9AM–3:30PM</div>
        <div class="col bg-warning p-3">Thursday – Classes 9AM–9PM</div>
        <div class="col bg-success p-3">Sat: Work from Home</div>
      </div>
    </div>

    <!-- Card -->
    <div class="container mt-4">
      <div class="card mx-auto" style="width: 18rem;">
        <img src="https://static.wixstatic.com/media/7383ad_c9a2ed5d32704d6b81504a4175fa440c~mv2.png" class="card-img-top" alt="Kean University">
        <div class="card-body">
          <h5 class="card-title">Kean University</h5>
          <p class="card-text">Studying IT – Cybersecurity. Courses in Java, Risk Management, and Compliance.</p>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="container mt-3 text-center">
      <button class="btn btn-primary">Contact Me</button>
      <button class="btn btn-success">My Skills</button>
    </div>
  <!-- Modal Example -->
<button type="button" class="btn btn-warning mt-3" data-bs-toggle="modal" data-bs-target="#infoModal">
  More Info
</button>
<div class="modal fade" id="infoModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Study Info</h5></div>
    <div class="modal-body">Extra info about your schedule, skills, etc.</div>
  </div></div>
</div>

<!-- Carousel Example -->
<div id="carouselExampleIndicators" class="carousel slide mt-4" data-bs-ride="carousel">
  <div class="carousel-indicators" id="carouselIndicators"></div>
  <div class="carousel-inner" id="carouselInner"></div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const response = await fetch("https://api.thecatapi.com/v1/images/search?limit=5");
  const catImages = await response.json();

  const carouselIndicators = document.getElementById("carouselIndicators");
  const carouselInner = document.getElementById("carouselInner");

  catImages.forEach((cat, index) => {
    const indicator = document.createElement("button");
    indicator.type = "button";
    indicator.setAttribute("data-bs-target", "#carouselExampleIndicators");
    indicator.setAttribute("data-bs-slide-to", index);
    if (index === 0) { indicator.classList.add("active"); }
    carouselIndicators.appendChild(indicator);

    const carouselItem = document.createElement("div");
    carouselItem.classList.add("carousel-item");
    if (index === 0) { carouselItem.classList.add("active"); }
    const img = document.createElement("img");
    img.src = cat.url;
    img.classList.add("d-block", "w-100");
    carouselItem.appendChild(img);
    carouselInner.appendChild(carouselItem);
  });
});
</script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
