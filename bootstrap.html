<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kean Study Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Joseph @ Kean</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Schedule</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Skills</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Grid -->
    <div class="container mt-4">
      <div class="row text-center">
        <div class="col bg-info p-3">Tuesday – Classes 9AM–3:30PM</div>
        <div class="col bg-warning p-3">Thursday – Classes 9AM–9PM</div>
        <div class="col bg-success p-3">Sat: Work from Home</div>
      </div>
    </div>

    <!-- Card -->
    <div class="container mt-4">
      <div class="card mx-auto" style="width: 18rem;">
        <img src="https://static.wixstatic.com/media/7383ad_c9a2ed5d32704d6b81504a4175fa440c~mv2.png" class="card-img-top" alt="Kean University">
        <div class="card-body">
          <h5 class="card-title">Kean University</h5>
          <p class="card-text">Studying IT – Cybersecurity. Courses in Java, Risk Management, and Compliance.</p>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="container mt-3 text-center">
      <button class="btn btn-primary">Contact Me</button>
      <button class="btn btn-success">My Skills</button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
